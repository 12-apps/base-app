name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies
        shell: bash
        env:
          # Authenticates the @12-apps scope against GitHub Packages (see .npmrc).
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          # No committed lockfile yet: resolve @12-apps/* fresh from GitHub
          # Packages and let CI generate it. Once a lockfile is committed, switch
          # back to --frozen-lockfile for reproducible installs.
          pnpm install --no-frozen-lockfile 2>&1 | tee install.log
      - name: Type check
        shell: bash
        run: |
          set -o pipefail
          pnpm check-types 2>&1 | tee typecheck.log
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee build.log
