name: CI

on:
  pull_request:
    branches: [main]
  # Mandatory full-suite safety net, with no lane-verdict reuse on push.
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  static:
    name: Static
    permissions:
      contents: read
      pull-requests: read
      actions: read # required by the reusable workflow's retry-gate declaration
    uses: 12-apps/ci/.github/workflows/monorepo-static.yml@ea88024608cb8c9f5ce8fe655fb64e6866bbf469 # v2.49.0
    with:
      # Public open-source CI must not inherit the organization's AWS fleet.
      runner: ubuntu-latest
      node-version: '24'
      stack-aware: true
      # Hash EVERY tracked merge-tree input. The engine adds runtime, source,
      # commands and immutable selection-base identity, and records only passes.
      lint-fingerprint-command: git rev-parse 'HEAD^{tree}'
      type-check-fingerprint-command: git rev-parse 'HEAD^{tree}'
      # Complete runtime/config surface for this starter, including SPA assets.
      # Keep docs prose out, but never use negative dorny patterns.
      code-paths: |
        apps/**
        packages/**
        scripts/**
        .github/workflows/**
        **/*.json
        **/*.mjs
        **/*.cjs
        **/*.ts
        **/*.tsx
        **/*.js
        **/*.jsx
        **/*.yaml
        **/*.yml
        **/*.sql
        **/*.prisma
        **/*.html
        **/*.css
        **/*.scss
        **/*.svg
        **/*.toml
        .node-version
        .npmrc
        patches/**

  contracts:
    name: CI contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test consumer CI contracts (no install)
        run: |
          mkdir -p reports
          node --test --test-reporter=spec --test-reporter=junit --test-reporter-destination=stdout --test-reporter-destination=reports/root.xml scripts/__tests__/*.test.mjs
      - name: Require executed root tests
        uses: 12-apps/ci/.github/actions/vitest-signal-guard@ea88024608cb8c9f5ce8fe655fb64e6866bbf469 # v2.49.0
        with:
          reports: reports/root.xml
          lane: CI contracts

  tests:
    name: Tests
    needs: [static, contracts]
    if: needs.static.outputs.code == 'true'
    permissions:
      contents: read
    uses: 12-apps/ci/.github/workflows/monorepo-tests.yml@ea88024608cb8c9f5ce8fe655fb64e6866bbf469 # v2.49.0
    with:
      # Public open-source CI must not inherit the organization's AWS fleet.
      runner: ubuntu-latest
      node-version: '24'
      stack-aware: true
      unit-test-command: node scripts/ci-unit.mjs --affected
      unit-full-command: node scripts/ci-unit.mjs
      unit-fingerprint-command: git rev-parse 'HEAD^{tree}'
      build-fingerprint-command: git rev-parse 'HEAD^{tree}'
      unit-junit-reports: apps/api/reports apps/events/reports apps/client/reports apps/admin/reports apps/super-admin/reports
      vitest-cache-paths: |
        apps/api/node_modules/.vite/vitest
        apps/events/node_modules/.vite/vitest
        apps/client/node_modules/.vite/vitest
        apps/admin/node_modules/.vite/vitest
        apps/super-admin/node_modules/.vite/vitest

  # Configure CI Success as required in a new repo. This file cannot change a
  # ruleset, and a green run is not evidence that branch protection is enabled.
  ci-success:
    name: CI Success
    if: always()
    needs: [static, contracts, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require each expected lane
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-success.mjs
