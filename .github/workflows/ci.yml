name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Lint, Type Check & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          # The @12-apps/* packages publish PUBLIC to registry.npmjs.org, so the
          # install needs no token. The lockfile is committed, so it is frozen —
          # an install that would change it is a bug in the diff, not something
          # CI should paper over.
          pnpm install --frozen-lockfile 2>&1 | tee install.log
      - name: Lint
        shell: bash
        run: |
          set -o pipefail
          pnpm lint 2>&1 | tee lint.log
      - name: Type check
        shell: bash
        run: |
          set -o pipefail
          pnpm check-types 2>&1 | tee typecheck.log
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee build.log

  # NOTE: this repo does not yet consume 12-apps/ci's monorepo-static.yml /
  # monorepo-tests.yml / quality.yml. Those are built for a pnpm workspace +
  # turborepo (they run `turbo lint/check-types --affected` and restore
  # per-package `.turbo` caches), and base-app is still a single package at the
  # repo root. Giving it that shape is 12-27; adopting the pipeline on top of it
  # is 12-10.
